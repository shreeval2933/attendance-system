<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
  </style>
  <script>
    // Route directly to student portal or admin portal cleanly
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("admin")) {
      window.location.replace("admin.html" + window.location.search);
    } else {
      window.location.replace("student.html" + window.location.search);
    }
  </script>
</head>
<body>
  <div style="text-align:center;">
    <div style="font-size:2rem; margin-bottom:12px;">🔒</div>
    <div style="font-size:0.95rem; font-weight:500;">Redirecting to Attendance Portal...</div>
  </div>
</body>
</html>
